services:
  stock-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-hub:latest
    container_name: stock-hub
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Stock Hub
      APP_VERSION: "0.1.0"
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
      DATA_PROVIDER: ${DATA_PROVIDER:-akshare,tushare,yfinance}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4}
      AI_BASE_URL: ${AI_BASE_URL:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      GATEWAY_TYPE: ${GATEWAY_TYPE:-sim}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  stock-hub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stock-hub-frontend:latest
    container_name: stock-hub-frontend
    depends_on:
      stock-hub:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped
