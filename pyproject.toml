[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "stock-hub"
version = "0.1.0"
description = "量化交易一体化平台"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Stock Hub Team" },
]

dependencies = [
    # 核心
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",

    # 数据源
    "akshare>=1.12.0",

    # 技术指标
    "pandas-ta>=0.3.14",

    # 任务调度
    "apscheduler>=3.10.0",

    # 日志
    "structlog>=24.1.0",

    # 工具
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

ai = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
]

qlib = [
    "pyqlib>=0.9.0",
    "lightgbm>=4.2.0",
    "xgboost>=2.0.0",
]

backtrader = [
    "backtrader>=1.9.78",
]

quantaxis = [
    "quantaxis>=2.0.0.dev33",
    "pymongo>=4.0",
]

easytrader = [
    "easytrader>=0.16",
    "pywinauto>=0.6",
]

qbot = [
    "torch>=2.0",
    "stable-baselines3>=2.0",
]

ai-quant = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

all-integrations = [
    "backtrader>=1.9.78",
    "quantaxis>=2.0.0.dev33",
    "pymongo>=4.0",
    "easytrader>=0.16",
    "pywinauto>=0.6",
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.scripts]
stock-hub = "src.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
